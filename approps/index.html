<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U.S. Federal Appropriations Process — Walkthrough</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    overflow: hidden;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: var(--vellum-100);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #page-header {
    flex-shrink: 0;
    background: var(--vellum-50);
    border-bottom: 1px solid #D8C9A8;
    padding: 10px 24px 0;
    position: relative; z-index: 10;
  }
  #diagram-meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #D8C9A8;
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #8A7A66;
  }
  #diagram-meta-bar .meta-right { color: #B5A793; }
  #mini-legend {
    display: flex; flex-wrap: wrap; gap: 8px 28px;
    padding: 10px 0;
    font-family: 'Inter Tight', sans-serif;
    font-size: 11.5px; color: #8A7A66;
  }
  #mini-legend .leg-item { display: flex; align-items: center; gap: 8px; }
  #mini-legend svg { flex-shrink: 0; }
  svg.flow {
    display: block;
    width: 100%; flex: 1; min-height: 0;
    cursor: pointer;
  }
  svg.flow text { font-family: var(--font-ui); }
  .canvas-bg { fill: var(--vellum-50); }
  .col-bg { fill: #FBF5E6; stroke: #D8C9A8; stroke-width: 1; }
  .phase-rule-outer { stroke: #8A7A66; stroke-width: 1.5; fill: none; }
  .phase-rule-inner { stroke: #A8843F; stroke-width: 1; fill: none; }
  .h-title { font-family: 'Libre Caslon Text', Georgia, serif; font-size: 30px; font-weight: 400; fill: #1F1812; }
  .h-sub   { font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 14px; fill: #5E4F3E; }
  .col-label { font-family: 'Libre Caslon Text', Georgia, serif; font-size: 16px; font-weight: 700; fill: #1F1812; letter-spacing: 0.02em; }
  .col-sub { font-family: 'Inter Tight', sans-serif; font-size: 10.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; fill: #8A7A66; }
  .phase-label { font-family: 'Libre Caslon Text', Georgia, serif; font-size: 17px; font-weight: 700; fill: #1F1812; letter-spacing: 0.005em; }
  .phase-numeral { font-family: 'Libre Caslon Text', Georgia, serif; font-style: italic; font-weight: 400; font-size: 19px; fill: #A8843F; }
  .ts { font-family: 'Inter Tight', sans-serif; font-size: 11.5px; fill: #5E4F3E; }
  .th { font-family: 'Inter Tight', sans-serif; font-size: 13px; font-weight: 600; fill: #1F1812; }
  .gray-ts { fill: #8A7A66; }
  .blue-fill   { fill: #E5EAF2; stroke: #1B365D; }
  .blue-th     { fill: #0E1F38; }
  .blue-ts     { fill: #1B365D; }
  .purple-fill { fill: #E8E4DD; stroke: #5E4F3E; }
  .purple-th   { fill: #1F1812; }
  .purple-ts   { fill: #3A2E22; }
  .teal-fill   { fill: #DEE6E2; stroke: #3F5F58; }
  .teal-th     { fill: #1E3A33; }
  .teal-ts     { fill: #3F5F58; }
  .yellow-fill { fill: #F4ECDC; stroke: #A8843F; }
  .yellow-th   { fill: #1F1812; }
  .yellow-ts   { fill: #5E4F3E; }
  .pink-fill   { fill: #ECE0C8; stroke: #7A5E26; }
  .pink-th     { fill: #1F1812; }
  .pink-ts     { fill: #5E4F3E; }
  .coral-fill  { fill: #DDE2EC; stroke: #1B365D; }
  .coral-th    { fill: #0E1F38; }
  .coral-ts    { fill: #1B365D; }
  .amber-fill  { fill: #F4E5C2; stroke: #7A5E26; }
  .amber-th    { fill: #4A3614; }
  .amber-ts    { fill: #7A5E26; }
  .red-fill    { fill: #F2D9D9; stroke: #9E2A2B; }
  .red-th      { fill: #6E1A1B; }
  .red-ts      { fill: #9E2A2B; }
  .green-fill  { fill: #DEE6D8; stroke: #4A6B3F; }
  .green-th    { fill: #2C4126; }
  .green-ts    { fill: #4A6B3F; }
  .gray-fill   { fill: #ECE6D8; stroke: #8A7A66; }
  .gray-th     { fill: #1F1812; }
  .strike-out  { fill: #F6EFE8; stroke: #9E2A2B; stroke-dasharray: 3 3; }
  .path-bg { fill: #F4ECDC; stroke: #B5A793; stroke-width: 1; }
  .path-label { font-family: 'Libre Caslon Text', Georgia, serif; font-style: italic; font-size: 13px; font-weight: 700; fill: #1F1812; }
  @keyframes march-forward { to { stroke-dashoffset: -16; } }
  @keyframes march-fail    { to { stroke-dashoffset: -16; } }
  .arr { stroke: #5E4F3E; stroke-width: 1.4; fill: none; }
  .arr-cross { stroke: #A8843F; stroke-width: 1.4; stroke-dasharray: 5 3; stroke-dashoffset: 0; fill: none; opacity: 1; animation: march-forward 400ms linear infinite; }
  .arr-feedback { stroke: #A8843F; stroke-width: 1.4; stroke-dasharray: 5 3; stroke-dashoffset: 0; fill: none; animation: march-forward 600ms linear infinite; }
  .arr-fail { stroke: #9E2A2B; stroke-width: 1.4; stroke-dasharray: 6 3; stroke-dashoffset: 0; fill: none; animation: march-fail 500ms linear infinite; }
  .arr-audit { stroke: #A8843F; stroke-width: 1.4; stroke-dasharray: 5 3; stroke-dashoffset: 0; fill: none; animation: march-forward 600ms linear infinite; }
  svg.flow g:has(rect) { transition: filter 160ms cubic-bezier(0.2,0,0,1); cursor: default; }
  svg.flow g:has(rect):hover { filter: drop-shadow(0 4px 12px rgba(31,24,18,.14)) drop-shadow(0 2px 4px rgba(31,24,18,.08)); }
  svg.flow g:has(rect) text, svg.flow g:has(rect) tspan { pointer-events: none; }

  /* ---- UI overlay ---- */
  #slide-dots {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 20; pointer-events: none;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #D8C9A8;
    transition: background 300ms, transform 300ms;
  }
  .dot.active  { background: #A8843F; transform: scale(1.4); }
  .dot.visited { background: #8A7A66; }

  #slide-ui {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 20; text-align: center; pointer-events: none;
    background: rgba(251,245,230,0.96);
    border: 2px solid #8A7A66;
    box-shadow: 0 2px 0 0 #A8843F, 0 4px 24px rgba(31,24,18,0.18);
    padding: 14px 36px 16px;
    border-radius: 2px;
    backdrop-filter: blur(6px);
    min-width: 400px;
  }
  #slide-numeral {
    font-family: 'Libre Caslon Text', Georgia, serif;
    font-style: italic; font-size: 28px; color: #A8843F;
    line-height: 1; margin-bottom: 4px;
    min-height: 32px;
  }
  #slide-title {
    font-family: 'Libre Caslon Text', Georgia, serif;
    font-size: 22px; font-weight: 700; color: #1F1812;
    margin-bottom: 10px;
  }
  #slide-meta {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #8A7A66;
    display: flex; gap: 20px; justify-content: center; align-items: center;
  }
  #slide-hint { opacity: 0.75; }

  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    z-index: 20;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(251,245,230,0.88);
    border: 1px solid #D8C9A8; border-radius: 2px;
    font-family: 'Inter Tight', sans-serif; font-size: 18px;
    color: #5E4F3E; cursor: pointer; opacity: 0.75;
    transition: opacity 180ms;
    backdrop-filter: blur(4px);
  }
  .nav-btn:hover { opacity: 1; }
  #nav-prev { left: 16px; }
  #nav-next { right: 16px; }
  .nav-btn.hidden { visibility: hidden; }

  /* Scroll mode — full-size browsable diagram */
  html.scroll-mode,
  body.scroll-mode {
    overflow-y: auto;
    height: auto;
  }
  body.scroll-mode svg.flow {
    width: 100%;
    flex: none;
    height: auto;
    cursor: default;
  }
  body.scroll-mode #slide-ui {
    position: fixed; /* stays visible while scrolling */
  }
  body.scroll-mode .nav-btn {
    position: fixed;
    top: 50vh;
  }
</style>
</head>

<script>
  /* ---------- Slide definitions ----------
     vb: [x, y, w, h] for SVG viewBox
     dim: { x, w } — a single vertical band to overlay (full height)
  */
  const SLIDES = [
    {
      numeral: '',
      label: 'The U.S. Federal Appropriations Process',
      progress: 'overview · 7 sections',
      vb: [0, 0, 1610, 4000],
      dim: null,
      scroll: true
    },
    {
      numeral: 'i.',
      label: 'Executive Budget Formulation',
      progress: '1 of 7',
      vb: [-10, 185, 730, 318],  // executive column only
      dim: null
    },
    {
      numeral: 'ii.',
      label: 'Budget Resolution & Allocation',
      progress: '2 of 7',
      vb: [718, 460, 900, 274],  // congressional columns only
      dim: null
    },
    {
      numeral: 'iii.',
      label: 'Subcommittee & Committee Actions',
      progress: '3 of 7',
      vb: [718, 690, 900, 690],  // congressional columns only
      dim: null
    },
    {
      numeral: 'iv.',
      label: 'Conference, Packaging & Final Passage',
      progress: '4 of 7',
      vb: [0, 1340, 1610, 722],
      dim: null
    },
    {
      numeral: 'v.',
      label: 'Post-Enactment: Sequestration & Apportionment',
      progress: '5 of 7',
      vb: [-10, 2020, 730, 534], // executive column only
      dim: null
    },
    {
      numeral: 'vi.',
      label: 'Impoundment',
      progress: '6 of 7',
      vb: [0, 2510, 1610, 940],
      dim: null
    },
    {
      numeral: 'vii.',
      label: 'Congressional Rescission',
      progress: '7 of 7',
      vb: [0, 3395, 1610, 395],
      dim: null
    }
  ];

  /* Extend viewBox height so slide-ui doesn't overlap content.
     Uses xMidYMin meet (top-aligned), so free space accumulates at the bottom.
     For height-constrained slides (content fills full viewport height), we push
     h outward until the rendered content ends above the slide-ui. */
  function getAdjustedVB(vb) {
    const [x, y, w, h] = vb;
    const ui  = document.getElementById('slide-ui');
    const uiRect = ui.getBoundingClientRect();
    const vW = window.innerWidth;
    const vH = window.innerHeight;
    /* Cap P at 35% of viewport so a mis-measured slide-ui never produces a
       viewBox so tall that content shrinks to invisible. */
    const P = Math.min((vH - uiRect.top) + 12, vH * 0.35);
    const scale = Math.min(vW / w, vH / h);
    const freeBottom = vH - h * scale;
    if (freeBottom >= P) return vb;
    const h1 = Math.ceil(h * vH / (vH - P));
    return [x, y, w, h1];
  }

  const svg       = document.getElementById('main-svg');
  const dimRect   = document.getElementById('dim-a');
  const elNum     = document.getElementById('slide-numeral');
  const elTitle   = document.getElementById('slide-title');
  const elProg    = document.getElementById('slide-progress');
  const dotsEl    = document.getElementById('slide-dots');
  const btnPrev   = document.getElementById('nav-prev');
  const btnNext   = document.getElementById('nav-next');

  let current = 0;
  let liveVB  = [0, 0, 1610, 4000];
  let liveDimX = 0, liveDimW = 0, liveDimOp = 0;
  let rafId = null;

  /* Build dots */
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(d);
  });

  function getDots() { return dotsEl.querySelectorAll('.dot'); }

  function ease(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function applyFrame(vb, dimX, dimW, dimOp) {
    svg.setAttribute('viewBox', vb.join(' '));
    if (dimOp < 0.005) {
      dimRect.setAttribute('opacity', '0');
    } else {
      dimRect.setAttribute('x', dimX);
      dimRect.setAttribute('width', dimW);
      dimRect.setAttribute('opacity', dimOp.toFixed(3));
    }
  }

  function goTo(idx) {
    if (idx === current) return;
    if (rafId) cancelAnimationFrame(rafId);

    const from = SLIDES[current];
    const to   = SLIDES[idx];

    const isZoomed = idx >= 1 && idx <= 7;
    const targetVB = isZoomed ? getAdjustedVB([...to.vb]) : [...to.vb];

    /* Leaving scroll mode: restore fixed layout and snap directly to target — no zoom-out animation */
    if (from.scroll) {
      /* Reset scroll position while overflow is still auto; once we apply
         overflow:hidden the scrollTo call becomes a no-op in most browsers,
         leaving a non-zero scrollTop that pushes all content off-screen. */
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      document.documentElement.classList.remove('scroll-mode');
      document.body.classList.remove('scroll-mode');
      liveVB = [...targetVB];
      svg.setAttribute('viewBox', liveVB.join(' '));
      dimRect.setAttribute('opacity', '0');
      liveDimOp = 0;
      current = idx;
      updateUI(idx);
      return;
    }

    const startVB    = [...liveVB];

    const startDimX  = liveDimX;
    const startDimW  = liveDimW;
    const startDimOp = liveDimOp;
    const targetDimX  = to.dim ? to.dim.x : 0;
    const targetDimW  = to.dim ? to.dim.w : 0;
    const targetDimOp = to.dim ? 0.82 : 0;

    if (to.dim && from.dim && (to.dim.x !== from.dim.x)) {
      dimRect.setAttribute('x', to.dim.x);
      dimRect.setAttribute('width', to.dim.w);
    }

    current = idx;
    updateUI(idx);

    /* Skip viewBox animation when entering scroll mode — just switch layout immediately */
    if (to.scroll) {
      liveVB = [...targetVB];
      svg.setAttribute('viewBox', targetVB.join(' '));
      dimRect.setAttribute('opacity', '0');
      document.documentElement.classList.add('scroll-mode');
      document.body.classList.add('scroll-mode');
      return;
    }

    const t0 = performance.now();
    const DUR = 680;

    function tick(now) {
      const raw = Math.min((now - t0) / DUR, 1);
      const e   = ease(raw);

      liveVB    = startVB.map((v, i) => lerp(v, targetVB[i], e));
      liveDimX  = to.dim ? to.dim.x : startDimX;
      liveDimW  = to.dim ? to.dim.w : startDimW;
      liveDimOp = lerp(startDimOp, targetDimOp, e);

      applyFrame(liveVB, liveDimX, liveDimW, liveDimOp);

      if (raw < 1) {
        rafId = requestAnimationFrame(tick);
      } else {
        liveVB    = [...targetVB];
        liveDimOp = targetDimOp;
        rafId = null;
        /* Entering scroll mode: switch layout after animation completes */
        if (to.scroll) {
          document.documentElement.classList.add('scroll-mode');
          document.body.classList.add('scroll-mode');
        }
      }
    }

    rafId = requestAnimationFrame(tick);
  }

  function updateUI(idx) {
    const s = SLIDES[idx];
    elNum.textContent   = s.numeral;
    elTitle.textContent = s.label;
    elProg.textContent  = s.progress;

    getDots().forEach((d, i) => {
      d.className = 'dot' +
        (i === idx ? ' active' : (i < idx ? ' visited' : ''));
    });

    btnPrev.classList.remove('hidden');
    btnNext.classList.remove('hidden');
  }

  function advance() {
    goTo((current + 1) % SLIDES.length);
  }
  function retreat() {
    goTo((current - 1 + SLIDES.length) % SLIDES.length);
  }

  /* Click anywhere on SVG to advance (disabled in scroll mode) */
  svg.addEventListener('click', () => { if (!SLIDES[current].scroll) advance(); });

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); advance(); }
    if (e.key === 'ArrowLeft')                   { e.preventDefault(); retreat(); }
    if (e.key === 'Escape' || e.key === 'Home')  { e.preventDefault(); goTo(0); }
  });

  /* Button clicks */
  btnPrev.addEventListener('click', e => { e.stopPropagation(); retreat(); });
  btnNext.addEventListener('click', e => { e.stopPropagation(); advance(); });

  /* Init UI */
  document.documentElement.classList.add('scroll-mode');
  document.body.classList.add('scroll-mode');
  updateUI(0);
</script>
